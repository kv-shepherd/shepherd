# Parity Deferral Table
# Registered multi-line `run: |` blocks that are exempt from the
# "new/unregistered run: | blocks prohibited" policy rule.
#
# Each entry identifies an existing inline script by file + job + step_name.
# Only NEW blocks not listed here will fail the parity gate.
#
# Fields:
#   file:       workflow filename relative to .github/workflows/
#   job:        job key in the workflow YAML
#   step_name:  the `- name:` value of the step (exact match)
#   owner:      responsible team or working group
#   expiry:     YYYY-MM-DD, must be ≤ 90 days from plan date (2026-05-27)
#   reason:     brief justification for deferral
#   migrating:  (optional) true if this block is being extracted in this PR

deferrals:
  # ── release-please.yml (1 block) ──
  - file: release-please.yml
    job: release-please
    step_name: "Trigger release artifacts workflow"
    owner: release-wg
    expiry: "2026-08-25"
    reason: "gh CLI dispatch requires multi-line script; no Makefile equivalent needed"

  # ── api-contract-validation.yml (5 blocks) ──
