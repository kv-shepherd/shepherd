services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: shepherd_db
    volumes:
      - shepherd_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_AUTO_MIGRATE: "true"
      SECURITY_SESSION_SECRET: ${SECURITY_SESSION_SECRET:?SECURITY_SESSION_SECRET is required}
      SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:?SECURITY_ENCRYPTION_KEY is required}
      SERVER_PORT: 8080
      SERVER_PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:?SERVER_PUBLIC_BASE_URL is required}
      SERVER_ALLOWED_ORIGINS: ${SERVER_ALLOWED_ORIGINS:-}
      SERVER_ALLOW_CREDENTIALS: "true"
      SERVER_UNSAFE_ALLOW_ALL_ORIGINS: "false"
      GIN_MODE: release
      LOG_LEVEL: info
      LOG_FORMAT: json
      RIVER_MAX_WORKERS: "10"
      WORKER_GENERAL_POOL_SIZE: "100"
      WORKER_K8S_POOL_SIZE: "50"
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://server:8080
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      server:
        condition: service_started

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx.codespaces.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_started

volumes:
  shepherd_pgdata:
