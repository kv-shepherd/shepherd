map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

limit_req_zone $binary_remote_addr zone=api_rate:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=login_rate:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Health checks
    location = /api/v1/health/live {
        proxy_pass http://server:8080/api/v1/health/live;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        access_log off;
    }

    location = /api/v1/health/ready {
        proxy_pass http://server:8080/api/v1/health/ready;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        access_log off;
    }

    # Login endpoint
    location = /api/v1/auth/login {
        limit_req zone=login_rate burst=3 nodelay;
        proxy_pass http://server:8080/api/v1/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # API
    location /api/v1/ {
        limit_req zone=api_rate burst=50 nodelay;
        proxy_pass http://server:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Frontend
    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
