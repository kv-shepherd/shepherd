services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd_password
      POSTGRES_DB: shepherd_db
    ports:
      - "5432:5432"
    # Ephemeral dev DB: no persistent volume mounted.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: shepherd-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://shepherd:shepherd_password@db:5432/shepherd_db?sslmode=disable"
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_AUTO_APPLY_VERSIONED_MIGRATIONS: "true"
      SECURITY_SESSION_SECRET: "${SECURITY_SESSION_SECRET:-}"
      SECURITY_ENCRYPTION_KEY: "${SECURITY_ENCRYPTION_KEY:-}"
      GIN_MODE: debug
      SERVER_PUBLIC_BASE_URL: "${DEV_PUBLIC_BASE_URL:-http://localhost:3000}"
      SERVER_ALLOWED_ORIGINS: "${DEV_ALLOWED_ORIGIN_URLS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}"
      SERVER_TRUSTED_PROXIES: "${SERVER_TRUSTED_PROXIES:-127.0.0.1/8,::1/128,172.16.0.0/12}"
      # Keep wildcard disabled by default; use nginx single-origin ingress instead.
      SERVER_ALLOW_CREDENTIALS: "true"
      SERVER_UNSAFE_ALLOW_ALL_ORIGINS: "false"
      RIVER_CONSUME_JOBS: "${RIVER_CONSUME_JOBS:-true}"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: shepherd-web
    environment:
      NEXT_PUBLIC_API_URL: "/api/v1"
      NEXT_PUBLIC_DEV_BROWSER_LOG_BRIDGE: "1"
      NEXT_PUBLIC_DEV_SECURE_ORIGIN: "${DEV_PUBLIC_BASE_URL:-https://localhost:3443}"
      NEXT_PUBLIC_DEV_HTTP_INGRESS_PORT: "${DEV_INGRESS_PORT:-3000}"
      # Enable only when filesystem events are unreliable.
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-false}"
    volumes:
      - ../../web:/app
      - ../../web/node_modules:/app/node_modules
    depends_on:
      - server

  nginx:
    image: nginx:1.27-alpine
    environment:
      WEB_UPSTREAM: "${WEB_UPSTREAM:-host.docker.internal:3001}"
      DEV_HTTPS_INGRESS_PORT: "${DEV_HTTPS_INGRESS_PORT:-3443}"
    ports:
      - "${DEV_INGRESS_PORT:-3000}:80"
      - "${DEV_HTTPS_INGRESS_PORT:-3443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../tmp/dev-nginx-tls:/etc/nginx/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
