services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: shepherd
      POSTGRES_PASSWORD: shepherd_password
      POSTGRES_DB: shepherd_db
    ports:
      - "5432:5432"
    # Ephemeral dev DB: no persistent volume mounted.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shepherd -d shepherd_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: shepherd-server
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://shepherd:shepherd_password@db:5432/shepherd_db?sslmode=disable"
      DATABASE_AUTO_MIGRATE: "false"
      DATABASE_AUTO_APPLY_VERSIONED_MIGRATIONS: "true"
      SECURITY_SESSION_SECRET: "${SECURITY_SESSION_SECRET:-}"
      SECURITY_ENCRYPTION_KEY: "${SECURITY_ENCRYPTION_KEY:-}"
      GIN_MODE: debug
      SERVER_PUBLIC_BASE_URL: "${DEV_PUBLIC_BASE_URL:-http://localhost:3000}"
      SERVER_ALLOWED_ORIGINS: "${DEV_ALLOWED_ORIGIN_URLS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001}"
      SERVER_TRUSTED_PROXIES: "${SERVER_TRUSTED_PROXIES:-127.0.0.1/8,::1/128,172.16.0.0/12}"
      # Keep wildcard disabled by default; use nginx single-origin ingress instead.
      SERVER_ALLOW_CREDENTIALS: "true"
      SERVER_UNSAFE_ALLOW_ALL_ORIGINS: "false"
      RIVER_CONSUME_JOBS: "${RIVER_CONSUME_JOBS:-true}"
      OBSERVABILITY_METRICS_ENABLED: "${OBSERVABILITY_METRICS_ENABLED:-true}"
      OBSERVABILITY_METRICS_PATH: "${OBSERVABILITY_METRICS_PATH:-/metrics}"
      OBSERVABILITY_DATABASE_METRICS_ENABLED: "${OBSERVABILITY_DATABASE_METRICS_ENABLED:-true}"
      OBSERVABILITY_DATABASE_METRICS_TIMEOUT: "${OBSERVABILITY_DATABASE_METRICS_TIMEOUT:-2s}"
      OBSERVABILITY_RIVER_METRICS_ENABLED: "${OBSERVABILITY_RIVER_METRICS_ENABLED:-true}"
      OBSERVABILITY_RIVER_METRICS_TIMEOUT: "${OBSERVABILITY_RIVER_METRICS_TIMEOUT:-2s}"
      OBSERVABILITY_BUSINESS_METRICS_ENABLED: "${OBSERVABILITY_BUSINESS_METRICS_ENABLED:-true}"
      OBSERVABILITY_BUSINESS_METRICS_TIMEOUT: "${OBSERVABILITY_BUSINESS_METRICS_TIMEOUT:-2s}"
      OBSERVABILITY_TRACING_ENABLED: "${OBSERVABILITY_TRACING_ENABLED:-true}"
      OBSERVABILITY_TRACING_SERVICE_NAME: "${OBSERVABILITY_TRACING_SERVICE_NAME:-shepherd}"
      OBSERVABILITY_TRACING_EXPORTER: "${OBSERVABILITY_TRACING_EXPORTER:-otlp_http}"
      OBSERVABILITY_TRACING_SAMPLE_RATIO: "${OBSERVABILITY_TRACING_SAMPLE_RATIO:-0.10}"
      OBSERVABILITY_TRACING_SHUTDOWN_TIMEOUT: "${OBSERVABILITY_TRACING_SHUTDOWN_TIMEOUT:-5s}"
      OBSERVABILITY_TRACE_QUERY_ENABLED: "${OBSERVABILITY_TRACE_QUERY_ENABLED:-true}"
      OBSERVABILITY_TRACE_QUERY_URL: "${OBSERVABILITY_TRACE_QUERY_URL:-http://tempo:3200}"
      OBSERVABILITY_TRACE_QUERY_TIMEOUT: "${OBSERVABILITY_TRACE_QUERY_TIMEOUT:-3s}"
      OBSERVABILITY_TRACE_QUERY_LIMIT: "${OBSERVABILITY_TRACE_QUERY_LIMIT:-100}"
      OBSERVABILITY_TRACE_QUERY_LOOKBACK: "${OBSERVABILITY_TRACE_QUERY_LOOKBACK:-1h}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: "${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://otel-collector:4318/v1/traces}"
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: "${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: shepherd-web
    environment:
      NEXT_PUBLIC_API_URL: "/api/v1"
      NEXT_PUBLIC_DEV_BROWSER_LOG_BRIDGE: "1"
      NEXT_PUBLIC_DEV_SECURE_ORIGIN: "${DEV_PUBLIC_BASE_URL:-https://localhost:3443}"
      NEXT_PUBLIC_DEV_HTTP_INGRESS_PORT: "${DEV_INGRESS_PORT:-3000}"
      # Enable only when filesystem events are unreliable.
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-false}"
    volumes:
      - ../../web:/app
      - ../../web/node_modules:/app/node_modules
    depends_on:
      - server

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${DEV_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/shepherd-recording-rules.yml:/etc/prometheus/rules/shepherd-recording-rules.yml:ro
      - ../monitoring/prometheus/shepherd-alerts.yml:/etc/prometheus/rules/shepherd-alerts.yml:ro
    depends_on:
      - server

  tempo:
    image: grafana/tempo:2.9.0
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "${DEV_TEMPO_PORT:-3200}:3200"
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.139.0
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    ports:
      - "${DEV_OTEL_GRPC_PORT:-4317}:4317"
      - "${DEV_OTEL_HTTP_PORT:-4318}:4318"
    volumes:
      - ../monitoring/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    depends_on:
      - tempo

  nginx:
    image: nginx:1.27-alpine
    environment:
      WEB_UPSTREAM: "${WEB_UPSTREAM:-host.docker.internal:3001}"
      DEV_HTTPS_INGRESS_PORT: "${DEV_HTTPS_INGRESS_PORT:-3443}"
    ports:
      - "${DEV_INGRESS_PORT:-3000}:80"
      - "${DEV_HTTPS_INGRESS_PORT:-3443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../../tmp/dev-nginx-tls:/etc/nginx/tls:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - server
