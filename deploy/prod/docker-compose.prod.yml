# =============================================================================
# KubeVirt Shepherd — Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env.prod up -d
#
# Prerequisites:
#   1. Build images first:
#      docker build -t shepherd-server:latest .
#      docker build -t shepherd-web:latest -f deploy/prod/web.Dockerfile web/
#   2. Prepare .env.prod from .env.prod.example
#   3. Place TLS cert/key in deploy/prod/tls/
# =============================================================================

services:
  # ---------- Optional PostgreSQL 18 (bundled topology) ----------
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shepherd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-shepherd_db}
    volumes:
      - shepherd_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shepherd} -d ${POSTGRES_DB:-shepherd_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No port binding to host — only reachable within compose network.
    # Uncomment below if you need external DB access:
    # ports:
    #   - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------- Go Backend (Shepherd API Server) ----------
  server:
    image: shepherd-server:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      SECURITY_SESSION_SECRET: ${SECURITY_SESSION_SECRET:?SECURITY_SESSION_SECRET is required}
      SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:?SECURITY_ENCRYPTION_KEY is required}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:?SERVER_PUBLIC_BASE_URL is required}
      SERVER_ALLOWED_ORIGINS: ${SERVER_ALLOWED_ORIGINS:-}
      SERVER_ALLOW_CREDENTIALS: ${SERVER_ALLOW_CREDENTIALS:-true}
      SERVER_UNSAFE_ALLOW_ALL_ORIGINS: ${SERVER_UNSAFE_ALLOW_ALL_ORIGINS:-false}
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RIVER_MAX_WORKERS: ${RIVER_MAX_WORKERS:-10}
      WORKER_GENERAL_POOL_SIZE: ${WORKER_GENERAL_POOL_SIZE:-100}
      WORKER_K8S_POOL_SIZE: ${WORKER_K8S_POOL_SIZE:-50}
    # Note: distroless image has no shell/wget/curl.
    # Health is inferred via restart policy + nginx upstream checks.
    # For orchestrators (K8s), use httpGet probe on /api/v1/health/ready.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------- Next.js Frontend (Production SSR) ----------
  web:
    image: shepherd-web:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://server:${SERVER_PORT:-8080}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3000/', res => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------- Nginx (TLS + Reverse Proxy) ----------
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tls/cert.pem:/etc/nginx/tls/cert.pem:ro
      - ./tls/key.pem:/etc/nginx/tls/key.pem:ro
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  shepherd_pgdata:
    driver: local
