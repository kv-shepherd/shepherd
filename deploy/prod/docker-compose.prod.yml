# =============================================================================
# KubeVirt Shepherd — Production Docker Compose
# =============================================================================
# Usage:
#   docker compose -f deploy/prod/docker-compose.prod.yml --env-file deploy/prod/.env.prod up -d
#
# Prerequisites:
#   1. Prepare .env.prod from .env.prod.example or run deploy-prod.sh.
#   2. Place TLS cert/key in deploy/prod/tls/ or let deploy-prod.sh generate
#      an initial self-signed certificate for testing.
# =============================================================================

services:
  # ---------- Optional PostgreSQL 18 (bundled topology) ----------
  db:
    image: ${POSTGRES_IMAGE:-postgres:18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shepherd}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-shepherd_db}
    volumes:
      - shepherd_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shepherd} -d ${POSTGRES_DB:-shepherd_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # No port binding to host — only reachable within compose network.
    # Uncomment below if you need external DB access:
    # ports:
    #   - "5432:5432"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # ---------- Go Backend (Shepherd API Server) ----------
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE is required. Run deploy-prod.sh or set SERVER_IMAGE in .env.prod}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-false}
      DATABASE_AUTO_APPLY_VERSIONED_MIGRATIONS: ${DATABASE_AUTO_APPLY_VERSIONED_MIGRATIONS:-true}
      SECURITY_SESSION_SECRET: ${SECURITY_SESSION_SECRET:-}
      SECURITY_ENCRYPTION_KEY: ${SECURITY_ENCRYPTION_KEY:-}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SERVER_PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:-https://localhost}
      SERVER_READ_HEADER_TIMEOUT: ${SERVER_READ_HEADER_TIMEOUT:-10s}
      SERVER_IDLE_TIMEOUT: ${SERVER_IDLE_TIMEOUT:-2m}
      SERVER_MAX_REQUEST_BODY_BYTES: ${SERVER_MAX_REQUEST_BODY_BYTES:-10485760}
      SERVER_ALLOWED_ORIGINS: ${SERVER_ALLOWED_ORIGINS:-}
      SERVER_TRUSTED_PROXIES: ${SERVER_TRUSTED_PROXIES:-127.0.0.1/8,::1/128,172.16.0.0/12}
      SERVER_ALLOW_CREDENTIALS: ${SERVER_ALLOW_CREDENTIALS:-true}
      SERVER_UNSAFE_ALLOW_ALL_ORIGINS: ${SERVER_UNSAFE_ALLOW_ALL_ORIGINS:-false}
      GIN_MODE: ${GIN_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      RIVER_MAX_WORKERS: ${RIVER_MAX_WORKERS:-10}
      RIVER_COMPLETED_JOB_RETENTION_PERIOD: ${RIVER_COMPLETED_JOB_RETENTION_PERIOD:-24h}
      WORKER_GENERAL_POOL_SIZE: ${WORKER_GENERAL_POOL_SIZE:-100}
      WORKER_K8S_POOL_SIZE: ${WORKER_K8S_POOL_SIZE:-50}
      OBSERVABILITY_METRICS_ENABLED: ${OBSERVABILITY_METRICS_ENABLED:-true}
      OBSERVABILITY_METRICS_PATH: ${OBSERVABILITY_METRICS_PATH:-/metrics}
      OBSERVABILITY_DATABASE_METRICS_ENABLED: ${OBSERVABILITY_DATABASE_METRICS_ENABLED:-true}
      OBSERVABILITY_DATABASE_METRICS_TIMEOUT: ${OBSERVABILITY_DATABASE_METRICS_TIMEOUT:-2s}
      OBSERVABILITY_RIVER_METRICS_ENABLED: ${OBSERVABILITY_RIVER_METRICS_ENABLED:-true}
      OBSERVABILITY_RIVER_METRICS_TIMEOUT: ${OBSERVABILITY_RIVER_METRICS_TIMEOUT:-2s}
      OBSERVABILITY_TRACING_ENABLED: ${OBSERVABILITY_TRACING_ENABLED:-false}
      OBSERVABILITY_TRACING_SERVICE_NAME: ${OBSERVABILITY_TRACING_SERVICE_NAME:-shepherd}
      OBSERVABILITY_TRACING_EXPORTER: ${OBSERVABILITY_TRACING_EXPORTER:-otlp_http}
      OBSERVABILITY_TRACING_SAMPLE_RATIO: ${OBSERVABILITY_TRACING_SAMPLE_RATIO:-0.10}
      OBSERVABILITY_TRACING_SHUTDOWN_TIMEOUT: ${OBSERVABILITY_TRACING_SHUTDOWN_TIMEOUT:-5s}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${OTEL_EXPORTER_OTLP_TRACES_HEADERS:-}
    # Note: distroless image has no shell/wget/curl.
    # Health is inferred via restart policy + nginx upstream checks.
    # For orchestrators (K8s), use httpGet probe on /api/v1/health/ready.
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------- Next.js Frontend (Production SSR) ----------
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required. Run deploy-prod.sh or set WEB_IMAGE in .env.prod}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api/v1
      INTERNAL_API_URL: http://server:${SERVER_PORT:-8080}
      SHEPHERD_PUBLIC_BASE_URL: ${SERVER_PUBLIC_BASE_URL:-https://localhost}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    depends_on:
      server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const http = require('http'); http.get('http://localhost:3000/', res => { process.exit(res.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ---------- Nginx (TLS + Reverse Proxy) ----------
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.30.1-alpine}
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_FILE:-./tls/cert.pem}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_FILE:-./tls/key.pem}:/etc/nginx/tls/key.pem:ro
    depends_on:
      server:
        condition: service_started
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--no-check-certificate", "--spider", "https://127.0.0.1/api/v1/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  shepherd_pgdata:
    driver: local
