# =============================================================================
# KubeVirt Shepherd — Optional Production Monitoring Overlay
# =============================================================================
# Usage:
#   docker compose \
#     -f deploy/prod/docker-compose.prod.yml \
#     -f deploy/prod/docker-compose.monitoring.yml \
#     --env-file deploy/prod/.env.prod \
#     up -d
# =============================================================================

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:?PROMETHEUS_IMAGE is required when monitoring overlay is enabled}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/prometheus/shepherd-recording-rules.yml:/etc/prometheus/rules/shepherd-recording-rules.yml:ro
      - ../monitoring/prometheus/shepherd-alerts.yml:/etc/prometheus/rules/shepherd-alerts.yml:ro
      - shepherd_prometheus_data:/prometheus
    depends_on:
      server:
        condition: service_started

  tempo:
    image: ${TEMPO_IMAGE:?TEMPO_IMAGE is required when monitoring overlay is enabled}
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "${TEMPO_PORT:-3200}:3200"
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - shepherd_tempo_data:/var/tempo

  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:?OTEL_COLLECTOR_IMAGE is required when monitoring overlay is enabled}
    restart: unless-stopped
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    volumes:
      - ../monitoring/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro
    depends_on:
      tempo:
        condition: service_started

  nginx:
    depends_on:
      otel-collector:
        condition: service_started

volumes:
  shepherd_prometheus_data:
    driver: local
  shepherd_tempo_data:
    driver: local
