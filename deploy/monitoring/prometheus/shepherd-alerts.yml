groups:
  - name: shepherd.baseline
    interval: 30s
    rules:
      - alert: ShepherdMetricsTargetDown
        expr: up{job="shepherd"} == 0
        for: 2m
        labels:
          severity: critical
          service: shepherd
        annotations:
          summary: Shepherd metrics target is down
          description: Prometheus cannot scrape the Shepherd metrics target.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdmetricstargetdown

      - alert: ShepherdHighHTTP5xxRate
        expr: shepherd:http_5xx:ratio5m > 0.05
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd HTTP 5xx ratio is high
          description: More than 5% of Shepherd HTTP requests are returning 5xx responses.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdhighhttp5xxrate

      - alert: ShepherdHighHTTPP95Latency
        expr: shepherd:http_request_duration_seconds:p95_5m > 2
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd HTTP p95 latency is high
          description: Global Shepherd HTTP p95 latency is above 2 seconds.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdhighhttpp95latency

      - alert: ShepherdOpenAPIValidationFailures
        expr: shepherd:openapi_validation_failures:rate5m > 0.01
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd OpenAPI validation failures are sustained
          description: Runtime OpenAPI validation failures are sustained for phase={{ $labels.phase }} code={{ $labels.code }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdopenapivalidationfailures

      - alert: ShepherdPostgresStatsScrapeFailed
        expr: shepherd_postgres_table_stats_scrape_success == 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd PostgreSQL stats scrape failed
          description: Shepherd cannot collect PostgreSQL table statistics for observability.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdpostgresstatsscrapefailed

      - alert: ShepherdRiverDeadTupleRatioHigh
        expr: shepherd_river_dead_tuple_ratio > 0.30
        for: 30m
        labels:
          severity: critical
          service: shepherd
        annotations:
          summary: Shepherd River dead tuple ratio is high
          description: River dead tuple ratio has stayed above the 30% RFC-0001 evaluation threshold.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdriverdeadtupleratiohigh

      - alert: ShepherdRiverQueueStatsScrapeFailed
        expr: shepherd_river_queue_stats_scrape_success == 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd River queue stats scrape failed
          description: Shepherd cannot collect River queue statistics for observability.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdriverqueuestatsscrapefailed

      - alert: ShepherdRiverQueueBacklogAgeHigh
        expr: shepherd_river_oldest_ready_job_age_seconds > 300
        for: 15m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd River queue backlog age is high
          description: The oldest ready Shepherd River job has waited more than 5 minutes for queue={{ $labels.queue }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdriverqueuebacklogagehigh

      - alert: ShepherdRiverJobsDiscarded
        expr: shepherd:river_recent_discarded_jobs:sum > 0
        for: 5m
        labels:
          severity: critical
          service: shepherd
        annotations:
          summary: Shepherd River jobs were discarded
          description: One or more Shepherd River jobs reached the discarded terminal state for queue={{ $labels.queue }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdriverjobsdiscarded

      - alert: ShepherdBusinessMetricsScrapeFailed
        expr: shepherd_business_metrics_scrape_success == 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd business metrics scrape failed
          description: Shepherd cannot collect approval and audit-log business metrics.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdbusinessmetricsscrapefailed

      - alert: ShepherdApprovalPendingTooLong
        expr: shepherd_business_approval_pending_oldest_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd approval has been pending too long
          description: The oldest pending approval has waited more than 24 hours for operation_type={{ $labels.operation_type }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdapprovalpendingtoolong

      - alert: ShepherdApprovalFailuresPresent
        expr: shepherd:business_approval_failed:sum > 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd approval failures are present
          description: One or more approval tickets are in FAILED status for operation_type={{ $labels.operation_type }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdapprovalfailurespresent

      - alert: ShepherdBatchApprovalPendingTooLong
        expr: shepherd_business_batch_approval_pending_oldest_age_seconds > 86400
        for: 15m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd batch approval has been pending too long
          description: The oldest pending batch approval has waited more than 24 hours for batch_type={{ $labels.batch_type }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdbatchapprovalpendingtoolong

      - alert: ShepherdBatchApprovalFailuresPresent
        expr: shepherd:business_batch_approval_failed:sum > 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd batch approval failures are present
          description: One or more batch approvals or child tasks have failed for batch_type={{ $labels.batch_type }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdbatchapprovalfailurespresent

      - alert: ShepherdApprovalFailureAuditActionsRecent
        expr: shepherd:business_approval_failure_audit_actions:sum > 0
        for: 10m
        labels:
          severity: warning
          service: shepherd
        annotations:
          summary: Shepherd approval failure audit actions were recorded
          description: Approval-related failure audit actions were recorded recently for action={{ $labels.action }}.
          runbook_url: docs/design/observability/alerts-baseline.md#shepherdapprovalfailureauditactionsrecent
