# Funding

KubeVirt Shepherd is an open-source project maintained by the CloudPasture community.

## How to Support

If you find this project useful, please consider:

1. ⭐ Starring the repository on GitHub
2. 📢 Sharing the project with others
3. 🐛 Reporting bugs and requesting features
4. 📖 Contributing to documentation
5. 💻 Contributing code
6. 💬 Joining the community on [Discord](https://discord.gg/9P2wtpPMUe)

