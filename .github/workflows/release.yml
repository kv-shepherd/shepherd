# KubeVirt Shepherd — Artifact Build Pipeline
# Triggered by tag push (v*) from release-please. Produces:
#   - Go runtime archives (binaries + migration assets) → attached to GitHub Release
#   - Docker images → ghcr.io with cosign keyless signatures
#
# Flow: release-please creates tag → this workflow builds artifacts
#
# ADR-0029: Pin actions to commit SHA, use specific runner version
name: Release Artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to build and publish, for example v0.1.0-alpha.1"
        required: true
        type: string

permissions:
  contents: write      # Attach assets to existing GitHub Release
  packages: write      # ghcr.io push
  id-token: write      # Cosign OIDC keyless signing
  attestations: write  # GitHub Attestations

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/kv-shepherd/shepherd-server
  WEB_IMAGE: ghcr.io/kv-shepherd/shepherd-web
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  # ── Preflight: extract version metadata ──
  preflight:
    name: Preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
    steps:
      - name: Extract version metadata
        id: meta
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "${TAG}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::notice ::Tag=${TAG} Version=${VERSION}"

  # ── Go Runtime Archives (matrix: amd64, arm64) ──
  build-go:
    name: Build Go (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [preflight]
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Build binaries
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          COMMIT="$(git rev-parse --short=8 HEAD)"
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ATLAS_VERSION="$(go list -m -f '{{ .Version }}' ariga.io/atlas)"
          ATLAS_IMAGE="arigaio/atlas:${ATLAS_VERSION#v}"

          mkdir -p dist
          go build -ldflags="${LDFLAGS}" -o dist/shepherd   ./cmd/server
          go build -ldflags="${LDFLAGS}" -o dist/seed       ./cmd/seed
          atlas_container="atlas-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}"
          docker rm -f "${atlas_container}" >/dev/null 2>&1 || true
          docker create \
            --platform "linux/${{ matrix.arch }}" \
            --name "${atlas_container}" \
            "${ATLAS_IMAGE}"
          docker cp "${atlas_container}:/atlas" dist/atlas
          docker rm -f "${atlas_container}" >/dev/null
          chmod 0755 dist/atlas
          mkdir -p dist/share/shepherd/migrations
          cp -R migrations/atlas dist/share/shepherd/migrations/atlas

          tar czf "shepherd-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -C dist shepherd seed atlas share
          sha256sum "shepherd-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            > "shepherd-v${VERSION}-linux-${{ matrix.arch }}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-linux-${{ matrix.arch }}
          path: |
            shepherd-*.tar.gz
            shepherd-*.tar.gz.sha256
          retention-days: 5

  # ── Docker Images (multi-platform, matrix: server + web) ──
  build-docker:
    name: Build Docker (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    needs: [preflight]
    strategy:
      matrix:
        include:
          - image: server
            dockerfile: Dockerfile
            context: "."
            target: runtime
            image_name: ghcr.io/kv-shepherd/shepherd-server
          - image: web
            dockerfile: deploy/prod/web.Dockerfile
            context: web
            image_name: ghcr.io/kv-shepherd/shepherd-web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to ghcr.io
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.is_prerelease == 'false' }}

      - name: Build metadata
        id: build_meta
        run: |
          atlas_version="$(awk '$1 == "ariga.io/atlas" { print $2; exit }' go.mod)"
          if [[ -z "${atlas_version}" ]]; then
            echo "ariga.io/atlas dependency not found in go.mod" >&2
            exit 1
          fi
          echo "atlas_image=arigaio/atlas:${atlas_version#v}" >> "$GITHUB_OUTPUT"

      - name: Build & Push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.image == 'server' && format('ATLAS_IMAGE={0}', steps.build_meta.outputs.atlas_image) || '' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign images with Cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            echo "Signing ${tag}@${DIGEST}"
            cosign sign --yes "${tag}@${DIGEST}"
          done <<< "${TAGS}"

  # ── Attach assets to GitHub Release (created by release-please) ──
  upload-assets:
    name: Upload Release Assets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [preflight, build-go, build-docker]
    steps:
      - name: Download Go artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: go-*

      - name: Consolidate checksums
        run: |
          cd artifacts
          cat go-*/shepherd-*.sha256 > checksums-sha256.txt
          echo "=== Release checksums ==="
          cat checksums-sha256.txt

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          # Upload Go binaries and checksums to the release created by release-please
          gh release upload "${TAG}" \
            artifacts/go-*/shepherd-*.tar.gz \
            artifacts/checksums-sha256.txt \
            --clobber \
            --repo "${{ github.repository }}"

          # Append Docker pull instructions to the release body
          DOCKER_BODY="
          ---
          ## Container Images

          \`\`\`bash
          # Pull
          docker pull ${{ env.SERVER_IMAGE }}:${{ needs.preflight.outputs.version }}
          docker pull ${{ env.WEB_IMAGE }}:${{ needs.preflight.outputs.version }}

          # Verify signature
          cosign verify ${{ env.SERVER_IMAGE }}:${{ needs.preflight.outputs.version }} \\
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \\
            --certificate-identity-regexp='github\\.com/kv-shepherd/shepherd'
          \`\`\`
          "
          EXISTING_BODY=$(gh release view "${TAG}" --json body -q '.body' --repo "${{ github.repository }}")
          if ! echo "${EXISTING_BODY}" | grep -q "Container Images"; then
            gh release edit "${TAG}" \
              --notes "${EXISTING_BODY}${DOCKER_BODY}" \
              --repo "${{ github.repository }}"
          fi
