# KubeVirt Shepherd — Automated Release Management (Google release-please)
#
# This workflow runs on every push to main and:
#   1. Parses conventional commits (feat:, fix:, etc.)
#   2. Creates/updates a "Release PR" with auto-generated CHANGELOG
#   3. When the Release PR is merged, creates a git tag + GitHub Release
#   4. The workflow explicitly dispatches release.yml for artifact build
#
# Commit format: https://www.conventionalcommits.org/
#   feat: add multi-cluster support
#   fix: correct RBAC permission check
#   feat!: redesign approval workflow (BREAKING CHANGE)
#
# ADR-0029: Pin actions to commit SHA, use specific runner version
name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_as:
        description: "Optional bootstrap version, for example 0.1.0-alpha.1"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Use the repository-scoped GitHub Actions token so release PRs are
          # authored by github-actions[bot] instead of a personal account.
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          release-as: ${{ github.event_name == 'workflow_dispatch' && inputs.release_as || '' }}

      - name: Trigger release artifacts workflow
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" >/dev/null

          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag_name="${RELEASE_TAG}"

          echo "::notice ::Triggered release.yml for ${RELEASE_TAG}"
