name: Frontend Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deadcode:
    name: Dead Code & Dependency Hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (high+)
        run: make -C .. ci-frontend-deadcode

  unit-tests:
    name: Unit & Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js build cache
        id: next_build_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next/cache
          key: ${{ runner.os }}-nextjs-build-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.js', 'web/**/*.jsx', 'web/**/*.ts', 'web/**/*.tsx', 'web/**/*.mjs', 'web/package.json', 'web/next.config.ts', 'web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-build-${{ hashFiles('web/package-lock.json') }}-

      - name: Report Next.js build cache status
        run: |
          echo "cache-hit=${{ steps.next_build_cache.outputs.cache-hit }}"
          if [ -d .next/cache ]; then
            du -sh .next/cache
          else
            echo ".next/cache directory does not exist yet"
          fi

      - name: Run frontend unit/type/build lane
        run: make -C .. ci-frontend-unit

  e2e-tests:
    name: E2E Mock Smoke (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Restore Next.js E2E build cache
        id: next_e2e_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: web/.next-e2e/ci/cache
          key: ${{ runner.os }}-nextjs-e2e-${{ hashFiles('web/package-lock.json') }}-${{ hashFiles('web/**/*.js', 'web/**/*.jsx', 'web/**/*.ts', 'web/**/*.tsx', 'web/**/*.mjs', 'web/package.json', 'web/next.config.ts', 'web/playwright.config.ts', 'web/tsconfig.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-e2e-${{ hashFiles('web/package-lock.json') }}-

      - name: Report Next.js E2E cache status
        run: |
          echo "cache-hit=${{ steps.next_e2e_cache.outputs.cache-hit }}"
          if [ -d .next-e2e/ci/cache ]; then
            du -sh .next-e2e/ci/cache
          else
            echo ".next-e2e/ci/cache directory does not exist yet"
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E Mock Smoke
        env:
          PW_E2E_RUN_ID: ci
        run: make -C .. ci-e2e-smoke

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
