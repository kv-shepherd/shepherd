# API Contract-First Enforcement (ADR-0021, ADR-0029)
# This workflow ensures OpenAPI spec remains the single source of truth
# by validating spec quality, detecting breaking changes, and verifying
# that generated code stays in sync with the specification.
#
# Security Notes (ADR-0029):
# - All third-party actions pinned to specific commit SHAs
# - Runner version pinned (ubuntu-24.04, not ubuntu-latest)
# - Minimal permissions following least privilege principle
# - Dependabot configured for automated updates

name: API Contract Validation

on:
  pull_request:
    # NOTE:
    # This workflow must run for every PR because its jobs are intended to be
    # configured as required checks in branch protection. If a required-check
    # workflow is skipped by path filters, GitHub leaves checks in "Pending".
  push:
    branches: [main]

# Principle of Least Privilege (ADR-0029)
permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Validate OpenAPI Specification (ADR-0029: vacuum)
  # ─────────────────────────────────────────────────────────────────
  lint-spec:
    name: Lint OpenAPI Spec
    runs-on: ubuntu-24.04  # Pin runner version
    timeout-minutes: 10    # Prevent stuck workflows
    steps:
      # Pin to specific commit SHA for security
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Check if spec exists
        id: check_file
        run: |
          if [ -f "api/openapi.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      # ADR-0029: Use vacuum instead of spectral (Go-native, 10x faster)
      - name: Run Vacuum Linting
        if: steps.check_file.outputs.exists == 'true'
        run: make ci-api-lint

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Detect Breaking Changes
  # ─────────────────────────────────────────────────────────────────
  breaking-changes:
    name: Detect Breaking Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Check if spec exists
        id: check_file
        run: |
          if [ -f "api/openapi.yaml" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for Breaking Changes
        if: steps.check_file.outputs.exists == 'true'
        run: make ci-api-breaking BASE_REF=${{ github.base_ref }}

      - name: Generate Changelog
        if: steps.check_file.outputs.exists == 'true'
        run: |
          make api-changelog BASE_REF=${{ github.base_ref }} > /tmp/api-changelog.md
          if [ ! -s /tmp/api-changelog.md ]; then
            echo "_No API changelog output._" > /tmp/api-changelog.md
          fi

      - name: Publish Changelog Comment
        if: github.event_name == 'pull_request' && steps.check_file.outputs.exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MARKER="<!-- api-contract-changelog -->"
          COMMENT_BODY="$(mktemp)"
          {
            echo "${MARKER}"
            echo "## API Changelog"
            echo
            cat /tmp/api-changelog.md
          } > "${COMMENT_BODY}"

          COMMENTS_API="https://api.github.com/repos/${REPO}/issues/${PR_NUMBER}/comments"
          EXISTING_ID="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${COMMENTS_API}" | jq -r --arg marker "${MARKER}" '.[] | select(.body | contains($marker)) | .id' | head -n1)"

          JSON_PAYLOAD="$(jq -Rs '{body: .}' < "${COMMENT_BODY}")"
          if [ -n "${EXISTING_ID}" ]; then
            curl -fsSL -X PATCH \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/${REPO}/issues/comments/${EXISTING_ID}" \
              -d "${JSON_PAYLOAD}" > /dev/null
            echo "✅ Updated existing API changelog comment (${EXISTING_ID})"
          else
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              "${COMMENTS_API}" \
              -d "${JSON_PAYLOAD}" > /dev/null
            echo "✅ Created new API changelog comment"
          fi

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Verify Generated Code is in Sync
  # ─────────────────────────────────────────────────────────────────
  generated-code-sync:
    name: Verify Generated Code Sync
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: lint-spec
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Setup Node.js (for TypeScript generation)
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Install dependencies
        run: |
          go mod download
          cd web && npm ci

      - name: Verify generated code sync
        run: make ci-api-generated-sync

  # ─────────────────────────────────────────────────────────────────
  # Stage 4: Contract Testing
  # ─────────────────────────────────────────────────────────────────
  contract-test:
    name: Contract Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [lint-spec, generated-code-sync]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c  # v6.4.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run contract tests with libopenapi-validator
        run: make ci-api-contract
