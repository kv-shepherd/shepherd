# golangci-lint v2 configuration for KubeVirt Shepherd
# Migrated from v1.64.8 to v2.10.1 on 2026-03-02.
# See: https://golangci-lint.run/docs/product/migration-guide/

version: "2"

run:
  go: "1.25"
  # timeout is disabled by default in v2; set per-invocation with --timeout if needed

linters:
  enable:
    - bodyclose
    - depguard
    - dupl
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - goconst
    - gocritic
    - gosec
    - misspell
    - nilerr
    - nolintlint
    - noctx
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace
    # shepherd-arch: custom architecture enforcement (ADR-0039)
    - shepherd-arch

  settings:
    depguard:
      rules:
        modern-stdlib:
          files:
            - "!$test"
          deny:
            - pkg: io/ioutil$
              desc: use io or os equivalents instead of deprecated io/ioutil
            - pkg: log$
              desc: use internal/pkg/logger instead of the standard log package
            - pkg: math/rand$
              desc: use math/rand/v2 or crypto/rand as appropriate
        runtime-shell:
          files:
            - "!$test"
            - "!cmd/**"
            - "!internal/testutil/**"
          deny:
            - pkg: os/exec$
              desc: shelling out is forbidden in runtime code
    dupl:
      threshold: 150
    exhaustive:
      default-signifies-exhaustive: true
    goconst:
      min-len: 3
      min-occurrences: 3
    forbidigo:
      forbid:
        - pattern: ^print(ln)?$
          msg: do not commit debug print statements
        - pattern: ^fmt\.Print.*$
          msg: use structured logging or explicit CLI output helpers instead of fmt.Print*
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        # Performance micro-optimization check with high false-positive/noise rate
        # for immutable DTO/config values in this codebase.
        - hugeParam
    govet:
      disable:
        - fieldalignment # too noisy
      enable-all: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: increment-decrement
        - name: var-naming
        - name: unexported-return
    # shepherd-arch custom linter settings (ADR-0039)
    custom:
      shepherd-arch:
        type: module
        description: >
          Architecture enforcement linters for kubevirt-shepherd.
          Enforces ADR compliance, import boundaries, concurrency rules,
          and coding conventions defined in docs/adr/.

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Allow dot imports in test files for testify
      - linters:
          - dupl
          - goconst
          - gosec
        path: _test\.go
      # Allow naked goroutine in main.go server start (exempt)
      - path: cmd/server/main\.go
        text: naked goroutine
      - path: ^cmd/
        linters:
          - forbidigo
      - path: internal/testutil/
        linters:
          - depguard
      # Allow naked goroutine in worker pool infrastructure
      - path: internal/pkg/worker/
        text: naked goroutine
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - kv-shepherd.io/shepherd
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
