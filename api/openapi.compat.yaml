    get:
      tags: [tickets]
      summary: List work-order tickets
      operationId: listTickets
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        conditions:
          - when: query.mine != true
            globalPermissions:
              anyOf:
                - 'ticket:view'
          - when: query.mine == true
            scopeFilters:
              - type: ticket_requester_is_actor
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          description: Filter tickets by exact workflow status.
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, CANCELLED, EXECUTING, SUCCESS, FAILED]
            example: PENDING
          example: PENDING
        - name: status_group
          in: query
          description: Filter approval tasks by a built-in status group.
          schema:
            type: string
            enum: [ACTIVE, TERMINAL, ATTENTION]
            example: ACTIVE
          example: ACTIVE
        - name: mine
          in: query
          description: |
            When true, return only tickets requested by the current
            authenticated user. This does not require ticket:view.
          schema:
            type: boolean
            example: true
          example: true
        - name: operation_type
          in: query
          description: Filter by ticket operation type.
          schema:
            type: string
            enum: [CREATE, MODIFY, DELETE, POWER, VNC_ACCESS]
            example: CREATE
          example: CREATE
        - name: selected_cluster_id
          in: query
          description: Filter approval tasks by the cluster selected during CREATE execution planning.
          schema:
            type: string
            example: selected-cluster-001
          example: selected-cluster-001
        - name: placement_advisory_code
          in: query
          description: Filter approval tasks by placement_evaluation.advisory_code persisted on CREATE tickets.
          schema:
            type: string
            example: example_code
          example: example_code
        - name: placement_snapshot
          in: query
          description: Filter by whether a placement evaluation snapshot exists on the ticket.
          schema:
            type: string
            enum: [present, missing]
            example: present
          example: present
      responses:
        '200':
          description: Ticket list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketList'
                example:
                  items:
                    - id: resource-001
                      event_id: event-001
                      status: PENDING
                      requester: example
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - id: resource-001
                    event_id: event-001
                    status: PENDING
                    requester: example
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
