            Must match the namespace name exactly.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Namespace deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  # ── Cluster Environment Update ───────────────────────
  /admin/clusters/{cluster_id}/environment:
    put:
      tags: [clusters, admin]
      summary: Update cluster environment
      operationId: updateClusterEnvironment
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterEnvironmentUpdate'
      responses:
        '200':
          description: Cluster environment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/clusters/{cluster_id}/policy:
    get:
      tags: [clusters, admin]
      summary: Get cluster policy
      operationId: getClusterPolicy
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cluster policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [clusters, admin]
      summary: Create or replace cluster policy
      operationId: upsertClusterPolicy
      parameters:
        - name: cluster_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterPolicyUpsertRequest'
      responses:
        '200':
          description: Cluster policy updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterPolicy'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── Notifications (ADR-0015 §20) ─────────────────────
  /notifications:
    get:
      tags: [notifications]
      summary: List notifications for current user
      operationId: listNotifications
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: unread_only
          in: query
          description: Filter to unread notifications only
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/unread-count:
    get:
      tags: [notifications]
      summary: Get unread notification count
      operationId: getUnreadCount
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCount'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notification_id}/read:
    patch:
      tags: [notifications]
      summary: Mark notification as read
      operationId: markNotificationRead
      parameters:
        - $ref: '#/components/parameters/NotificationID'
      responses:
        '204':
          description: Notification marked as read
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/mark-all-read:
    post:
      tags: [notifications]
      summary: Mark all notifications as read
      operationId: markAllNotificationsRead
      responses:
        '204':
          description: All notifications marked as read
  # ── Audit Logs ──────────────────────────────────────
  /audit-logs:
    get:
      tags: [audit, admin]
      summary: List audit logs
      operationId: listAuditLogs
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Fuzzy search across action, actor, resource type, and resource ID
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: category
          in: query
          description: Curated activity category preset for common audit views
          schema:
            type: string
            enum: [requests, approvals, resource_changes, system_tasks]
        - name: actor
          in: query
          schema:
            type: string
        - name: resource_type
          in: query
          schema:
            type: string
        - name: resource_id
          in: query
          schema:
            type: string
        - name: approval_decision
          in: query
          description: Filter approval audit entries by details.decision (for example approved, rejected, validation_failed)
          schema:
            type: string
        - name: placement_reason_code
          in: query
          description: Filter approval audit entries by details.placement_evaluation.reason_code
          schema:
            type: string
        - name: placement_advisory_code
          in: query
          description: Filter approval audit entries by details.placement_evaluation.advisory_code
          schema:
            type: string
      responses:
        '200':
          description: Audit log list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogList'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  # ── Security Schemes ────────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  # ── Reusable Parameters (ADR-0023 Pagination) ──────
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      description: Items per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Case-insensitive search text
      schema:
        type: string
    SystemCreatedBySearch:
      name: created_by
      in: query
      description: Case-insensitive creator filter for systems
      schema:
        type: string
    SystemCreatedByExact:
      name: created_by_exact
      in: query
      description: Exact creator filter for systems
      schema:
        type: string
    SystemServiceSearch:
      name: service_search
      in: query
      description: Case-insensitive filter across related service names and descriptions
      schema:
        type: string
    SystemServiceIDFilter:
      name: service_id
      in: query
      description: Exact related service filter for systems
      schema:
        type: string
    SystemMemberSearch:
      name: member_search
      in: query
      description: Case-insensitive filter across related system member username, email, or display name
      schema:
        type: string
    SystemMemberIDFilter:
      name: member_id
      in: query
      description: Exact related system member filter
      schema:
        type: string
    SortBy:
      name: sort_by
      in: query
      description: Field to sort by
      schema:
        type: string
    SortOrder:
      name: sort_order
      in: query
      description: Sort direction
      schema:
        type: string
        enum: [asc, desc]
        default: asc
    SystemID:
      name: system_id
      in: path
      required: true
      schema:
        type: string
    SystemIDFilter:
      name: system_id
      in: query
      description: Filter services by parent system id
      schema:
        type: string
    VMID:
      name: vm_id
      in: path
      required: true
      schema:
        type: string
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
    BatchID:
      name: batch_id
      in: path
      required: true
      schema:
        type: string
    ServiceID:
      name: service_id
      in: path
      required: true
      schema:
        type: string
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
    TemplateID:
      name: template_id
      in: path
      required: true
      schema:
        type: string
    InstanceSizeID:
      name: instance_size_id
      in: path
      required: true
      schema:
        type: string
    RoleID:
      name: role_id
      in: path
      required: true
      schema:
        type: string
    RoleBindingID:
      name: binding_id
      in: path
      required: true
      schema:
        type: string
    ProviderID:
      name: provider_id
      in: path
      required: true
      schema:
        type: string
    MappingID:
      name: mapping_id
      in: path
      required: true
      schema:
        type: string
    DirectorySyncJobID:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    Confirm:
      name: confirm
      in: query
      description: Simple deletion confirmation flag (ADR-0015 §13)
      schema:
        type: boolean
    ConfirmName:
      name: confirm_name
      in: query
      description: |
        Type resource name to confirm deletion (ADR-0015 §13 addendum).
        Must match the resource name exactly.
      schema:
        type: string
    NamespaceID:
      name: namespace_id
      in: path
      required: true
      schema:
        type: string
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
  # ── Reusable Responses ──────────────────────────────
  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadGateway:
      description: Upstream dependency rejected the request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailable:
      description: Requested capability is currently unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  # ── Schemas ─────────────────────────────────────────
  schemas:
    MaskField:
      type: object
      required: [path, display_name]
      properties:
        path:
          type: string
          description: Dot-notation JSON path resolving within the provided unified schema.
        display_name:
          type: string
          description: Desired localized or standardized label for the UI form projection.
        display_name_key:
          type: string
          description: Optional i18n key for localized field label lookup.
        help_text:
          type: string
          description: Optional plain help text shown via tooltip/help icon.
        help_key:
          type: string
          description: Optional i18n key for localized help text lookup.
        placeholder:
          type: string
          description: Optional plain placeholder shown in form control.
        placeholder_key:
          type: string
          description: Optional i18n key for localized placeholder lookup.
    SchemaMask:
      type: object
      required: [quick_fields]
      properties:
        quick_fields:
          type: array
          items:
            $ref: '#/components/schemas/MaskField'
        advanced_fields:
          type: array
          items:
            $ref: '#/components/schemas/MaskField'
        professional_fields:
          type: array
          items:
            $ref: '#/components/schemas/MaskField'
    DynamicSchemaResponse:
      type: object
      required: [schema, mask]
      properties:
        schema:
          type: object
          description: Full structure representing the requested JSON Schema payload.
          additionalProperties: true
        mask:
          $ref: '#/components/schemas/SchemaMask'
        schema_version:
          type: string
          description: |
            Semantic version of the schema (e.g. "1.2.0").
            Frontend uses this for cache drift detection and audit (ADR-0023).
          example: "1.2.0"
        source:
          type: string
          enum: [cache, embedded, remote]
          description: |
            Data source of the schema response (ADR-0023 degradation strategy):
            - cache:    Served from server-side schema cache (nominal path).
            - embedded: Backend fell back to a bundled embedded schema (warn user).
            - remote:   Fetched live from KubeVirt API (slow path, no cache).
        degraded:
          type: boolean
          default: false
          description: |
            When true, the response uses an older or embedded fallback schema.
            Frontend MUST display a warning banner per ADR-0023 UI Degradation States.
        fetched_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the schema was fetched or last cached.
    # ── Common ──────────────────────────────────────
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
        version:
          type: string
        checks:
          type: object
          properties:
            database:
              type: string
          additionalProperties:
            type: string
    Error:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: Machine-readable error code (frontend handles i18n)
        message:
          type: string
          description: English log message (not for UI display)
        params:
          type: object
          additionalProperties: true
        field_errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
    # ── System ──────────────────────────────────────
    System:
      type: object
      required: [id, name, created_by, created_at]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 15
        description:
          type: string
        created_by:
          type: string
        tenant_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          x-oapi-codegen-extra-tags:
            validate: "required,max=15"
          type: string
          maxLength: 15
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
          description: RFC 1035 compliant name (ADR-0019)
        description:
          type: string
          description: Markdown supported
    SystemUpdateRequest:
      type: object
      required: [description]
      properties:
        description:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          description: Markdown supported
    SystemList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/System'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SystemFilterOptionsResponse:
      type: object
      properties:
        creators:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        services:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
        members:
          type: array
          items:
            $ref: '#/components/schemas/FilterOption'
    # ── Service ─────────────────────────────────────
    Service:
      type: object
      required: [id, name, system_id, system_name, created_at]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        system_id:
          type: string
        system_name:
          type: string
          description: Parent system display name for UI presentation
        next_instance_index:
          type: integer
          description: Next allocatable per-service instance index
        created_at:
          type: string
          format: date-time
    ServiceCreateRequest:
      type: object
      required: [name]
      properties:
        name:
          x-oapi-codegen-extra-tags:
            validate: "required,max=15"
          type: string
          maxLength: 15
          pattern: '^[a-z]([a-z0-9-]*[a-z0-9])?$'
        description:
          type: string
          description: Markdown supported
    ServiceUpdateRequest:
      type: object
      required: [description]
      properties:
        description:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          description: Markdown supported
    ServiceList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ServiceWorkspaceSummary:
      type: object
      required: [visible_vm_count, recent_request_count]
      properties:
        visible_vm_count:
          type: integer
        recent_request_count:
          type: integer
    ServiceWorkspaceContext:
      type: object
      required: [service, summary, visible_vms, recent_requests]
      properties:
        service:
          $ref: '#/components/schemas/Service'
        summary:
          $ref: '#/components/schemas/ServiceWorkspaceSummary'
        visible_vms:
          type: array
          items:
            $ref: '#/components/schemas/VM'
        recent_requests:
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
    # ── VM ──────────────────────────────────────────
    VM:
      type: object
      required: [id, name, namespace, status]
      properties:
        id:
          type: string
        name:
          type: string
        namespace:
          type: string
        cluster_id:
          type: string
        cluster_name:
          type: string
          description: Display name of the cluster (populated from cluster registry)
        status:
          type: string
          enum: [CREATING, STARTING, RUNNING, STOPPING, STOPPED, DELETING, FAILED, PENDING, MIGRATING, PAUSED, UNKNOWN, NOT_FOUND]
        hostname:
          type: string
        node_name:
          type: string
          description: Current KubeVirt VMI node name when the VM is scheduled
        host_ip:
          type: string
          description: Primary observed node IP for the current VMI placement
        ip_address:
          type: string
          description: Primary observed guest IP address from the live VMI status
        os_name:
          type: string
          description: Best-effort guest operating system name from KubeVirt guest OS info, or creation snapshot fallback
        os_version:
          type: string
          description: Best-effort guest operating system version from KubeVirt guest OS info, or creation snapshot fallback
        os_family:
          type: string
          description: Best-effort guest operating system family (for example linux or windows)
        service_id:
          type: string
        service_name:
          type: string
        system_id:
          type: string
        system_name:
          type: string
        instance:
          type: string
        cpu_cores:
          type: number
          format: float
        memory_gi:
          type: number
          format: float
        disk_gb:
          type: integer
        ticket_id:
          type: string
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
        environment:
          type: string
          enum: [test, prod]
          description: Inherited from cluster environment (ADR-0015 §15)
        console_capabilities:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: '#/components/schemas/VMConsoleCapabilities'
        provisioning:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: '#/components/schemas/ProvisioningStatus'
    VMConsoleCapabilities:
      type: object
      required: [serial_available, vnc_available]
      properties:
        serial_available:
          type: boolean
        vnc_available:
          type: boolean
        preferred_console_type:
          x-go-type-skip-optional-pointer: false
          allOf:
            - $ref: '#/components/schemas/VMConsoleType'
    ProvisioningCondition:
      type: object
      properties:
        type:
          type: string
        status:
          type: string
        reason:
          type: string
        message:
          type: string
        last_transition_time:
          type: string
          format: date-time
    ProvisioningEvent:
      type: object
      properties:
        type:
          type: string
        reason:
          type: string
        message:
          type: string
        count:
          type: integer
        first_observed:
          type: string
          format: date-time
        last_observed:
          type: string
          format: date-time
    ProvisioningStatus:
      type: object
      properties:
        root_data_volume_name:
          type: string
        claim_name:
          type: string
        phase:
          type: string
        progress:
          type: string
        restart_count:
          type: integer
        pvc_phase:
          type: string
        clone_type:
          type: string
          description: CDI clone execution type observed on the root PVC, for example `copy` when host-assisted fallback is used.
        clone_phase:
          type: string
          description: CDI clone phase annotation observed on the root PVC.
        clone_fallback_reason:
          type: string
          description: CDI fallback reason observed on the root PVC when efficient clone prerequisites were not met.
        failure_message:
          type: string
        conditions:
          type: array
          items:
            $ref: '#/components/schemas/ProvisioningCondition'
        recent_events:
          type: array
          items:
            $ref: '#/components/schemas/ProvisioningEvent'
    VMCreateRequest:
      type: object
      required: [service_id, template_id, instance_size_id, namespace, reason]
      properties:
        service_id:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          format: uuid
        template_id:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          format: uuid
        instance_size_id:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          format: uuid
        namespace:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
          description: Target K8s namespace (immutable after submission, ADR-0017)
        reason:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
        # ⚠️ cluster_id is intentionally ABSENT — see ADR-0017
    VMRequestPrefill:
      type: object
      required: [system_id, service_id, template_id, instance_size_id, namespace, reason, batch_count]
      properties:
        system_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        instance_size_id:
          type: string
          format: uuid
        namespace:
          type: string
        reason:
          type: string
        batch_count:
          type: integer
          minimum: 1
    VMModifyRequest:
      type: object
      required: [reason]
      properties:
        reason:
          x-oapi-codegen-extra-tags:
            validate: "required"
          type: string
        target_cpu_cores:
          type: number
          format: double
          description: |
            Desired total vCPU count after the change. Online CPU changes are
            validated against the current socket topology and may only expand.
        target_memory_gi:
          type: number
          format: double
          description: Desired total guest memory in Gi after the change.
        target_disk_gb:
          type: integer
          description: Desired total root-volume size in Gi after the change.
    VMModifyContext:
      type: object
      required:
        - vm_id
        - vm_name
        - namespace
        - current_cpu_cores
        - current_memory_gi
        - current_disk_gb
        - cpu_supported
        - memory_supported
        - disk_supported
      properties:
        vm_id:
          type: string
        vm_name:
          type: string
        namespace:
          type: string
        cluster_id:
          type: string
        cluster_name:
          type: string
        current_cpu_cores:
          type: number
          format: double
        current_memory_gi:
          type: number
          format: double
        current_disk_gb:
          type: integer
        cpu_supported:
          type: boolean
        cpu_reason:
          type: string
        memory_supported:
          type: boolean
        memory_reason:
          type: string
        disk_supported:
          type: boolean
        disk_reason:
          type: string
    VMRequestContext:
      type: object
      required: [templates, instance_sizes, namespaces]
      properties:
        templates:
          type: array
          items:
            $ref: '#/components/schemas/Template'
        instance_sizes:
          type: array
          items:
            $ref: '#/components/schemas/InstanceSize'
        namespaces:
          type: array
          items:
            type: string
        placement_hint:
          $ref: '#/components/schemas/VMPlacementHint'
    VMPlacementHint:
      type: object
      required: [status, compatible_cluster_count, evaluated_cluster_count]
      properties:
        status:
          type: string
          enum: [AVAILABLE, UNAVAILABLE]
        compatible_cluster_count:
