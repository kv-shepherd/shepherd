          required: true
          schema:
            type: string
            example: external-approval-001
          example: external-approval-001
        - name: X-Shepherd-Timestamp
          in: header
          description: RFC3339 timestamp included in the polling request signature.
          required: true
          schema:
            type: string
            format: date-time
            example: '2026-01-01T00:00:00Z'
