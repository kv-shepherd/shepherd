  # ── Clusters ────────────────────────────────────────
  /admin/clusters:
    get:
      tags: [clusters, admin]
      summary: List clusters
      description: |
        List registered clusters. Supports feature-based filtering via `requires`
        query parameter (ADR-0014 Layer 3 / P2-A).
      operationId: listClusters
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: requires
          in: query
          required: false
          description: |
            Comma-separated list of required KubeVirt feature gates.
            Only clusters whose `enabled_features` is a superset of all listed
            features are returned. Case-insensitive.
            Example: `?requires=LiveMigration,Snapshot`
          schema:
            type: string
            example: "LiveMigration,Snapshot"
        - name: namespace
          in: query
          required: false
          description: Filter clusters compatible with a CREATE request targeting this namespace.
          schema:
            type: string
        - name: template_id
          in: query
          required: false
          description: Filter clusters compatible with a CREATE request using this template.
          schema:
            type: string
        - name: instance_size_id
          in: query
          required: false
          description: Filter clusters compatible with a CREATE request using this instance size.
          schema:
            type: string
        - name: selected_storage_class
          in: query
          required: false
          description: Optional storage class selected by approver when evaluating cluster policy compatibility.
          schema:
            type: string
        - name: selected_dv_access_modes
          in: query
          required: false
          description: Optional explicit CDI DataVolume PVC accessModes selected during approval when root volume auto resolution is ambiguous.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: selected_dv_volume_mode
          in: query
          required: false
          description: Optional explicit CDI DataVolume PVC volumeMode selected during approval when root volume auto resolution is ambiguous.
          schema:
            type: string
            enum: [Block, Filesystem]
        - name: cpu_request
          in: query
          required: false
          description: Optional override CPU request in cores for compatibility evaluation.
          schema:
            type: number
            minimum: 0.5
            multipleOf: 0.5
        - name: cpu_limit
          in: query
          required: false
          description: Optional override CPU limit in cores for compatibility evaluation.
          schema:
            type: number
            minimum: 0.5
            multipleOf: 0.5
        - name: memory_request_gi
          in: query
          required: false
          description: Optional override memory request in Gi for compatibility evaluation.
          schema:
            type: number
            minimum: 0.5
            multipleOf: 0.5
        - name: memory_limit_gi
          in: query
          required: false
          description: Optional override memory limit in Gi for compatibility evaluation.
          schema:
            type: number
            minimum: 0.5
            multipleOf: 0.5
        - name: include_incompatible
          in: query
          required: false
          description: When true, keep incompatible clusters in the result and annotate them with compatibility reasons instead of filtering them out.
          schema:
            type: boolean
      responses:
        '200':
          description: Cluster list (filtered by feature requirements and optional CREATE placement compatibility context)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterList'
        '400':
          description: Invalid compatibility evaluation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [clusters, admin]
      summary: Register a cluster
      operationId: createCluster
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClusterCreateRequest'
      responses:
        '201':
          description: Cluster registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cluster'
        '400':
          $ref: '#/components/responses/BadRequest'
