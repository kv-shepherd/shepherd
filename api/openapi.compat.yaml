openapi: 3.0.3
info:
  title: KubeVirt Shepherd API
  description: |
    API for managing KubeVirt virtual machines and cloud-native governance.
    Adheres to ADR-0021: API Contract-First Development.
  version: 1.0.0
  contact:
    name: KubeVirt Shepherd Team
    url: https://github.com/kv-shepherd/shepherd
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: Production API
tags:
  - name: health
    description: Health check endpoints
  - name: systems
    description: System management (ADR-0015)
  - name: services
    description: Service management
  - name: vms
    description: Virtual machine management
  - name: approval
    description: Approval workflow (ADR-0005)
  - name: builtin-approval
    description: Built-in approval provider task operations
  - name: external-approval-systems
    description: External approval provider registry management
  - name: external-approval
    description: External approval provider decision callbacks
  - name: tickets
    description: Work-order ticket query and lifecycle operations
  - name: clusters
    description: Cluster management
  - name: templates
    description: Template management
  - name: instance-sizes
    description: Instance size management (ADR-0018)
  - name: auth
    description: Authentication
  - name: admin
    description: Admin operations
  - name: adoptions
    description: Resource adoption compensation management
  - name: audit
    description: Audit log operations
  - name: namespaces
    description: Namespace registry management (ADR-0017)
  - name: notifications
    description: Platform inbox notifications (ADR-0015 §20)
  - name: rbac
    description: RBAC role and global binding management
  - name: auth-providers
    description: Pluggable authentication provider management
  - name: schemas
    description: Dynamic configuration schemas for entities
  - name: observability
    description: Administrative tracing and business signal observability endpoints
paths:
  # ── Health ──────────────────────────────────────────
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getLiveness
      security: []
      x-rbac:
        authentication: public
        platformAdminOverride: false
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
                example:
                  status: ok
                  version: example
                  checks:
                    database: example
              example:
                status: ok
                version: example
                checks:
                  database: example
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      x-rbac:
        authentication: public
        platformAdminOverride: false
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
                example:
                  status: ok
                  version: example
                  checks:
                    database: example
              example:
                status: ok
                version: example
                checks:
                  database: example
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
                # ── Schemas ─────────────────────────────────────────
                example:
                  status: ok
                  version: example
                  checks:
                    database: example
              example:
                status: ok
                version: example
                checks:
                  database: example
  /schemas/{entity_type}:
    get:
      tags: [schemas]
      summary: Retrieve dynamic schema and UI mask for an entity
      operationId: getDynamicSchema
      # Public endpoint: schema metadata does not contain sensitive data and
      # must be accessible before a user logs in (bootstrap scenario, ADR-0023).
      security: []
      x-rbac:
        authentication: public
        platformAdminOverride: false
      parameters:
        - name: entity_type
          in: path
          description: Dynamic schema entity type to retrieve.
          required: true
          schema:
            type: string
            # Only entity types with dynamic schema forms are listed here.
            # template: excluded — cloud_init is a static YAML textarea, no dynamic schema (master-flow Step 3).
            # cluster:  excluded — no cluster-level override schema defined yet (ADR-0023 phase 2).
            enum: [instancesize]
            example: instancesize
          example: instancesize
      responses:
        '200':
          description: Dynamic schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicSchemaResponse'
                example:
                  schema: {}
                  mask:
                    quick_fields:
                      - path: /example/path
                        display_name: Example User
                        display_name_key: example.key
                    advanced_fields:
                      - path: /example/path
                        display_name: Example User
                        display_name_key: example.key
                    professional_fields:
                      - path: /example/path
                        display_name: Example User
                        display_name_key: example.key
                  schema_version: "1.2.0"
              example:
                schema: {}
                mask:
                  quick_fields:
                    - path: /example/path
                      display_name: Example User
                      display_name_key: example.key
                  advanced_fields:
                    - path: /example/path
                      display_name: Example User
                      display_name_key: example.key
                  professional_fields:
                    - path: /example/path
                      display_name: Example User
                      display_name_key: example.key
                schema_version: "1.2.0"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Systems ─────────────────────────────────────────
  /systems:
    get:
      tags: [systems]
      summary: List systems
      operationId: listSystems
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:read'
        scopeFilters:
          - type: actor_visible_systems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SystemCreatedBySearch'
        - $ref: '#/components/parameters/SystemCreatedByExact'
        - $ref: '#/components/parameters/SystemServiceSearch'
        - $ref: '#/components/parameters/SystemServiceIDFilter'
        - $ref: '#/components/parameters/SystemMemberSearch'
        - $ref: '#/components/parameters/SystemMemberIDFilter'
        - $ref: '#/components/parameters/SystemsSortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: System list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
                example:
                  items:
                    - id: resource-001
                      name: example-resourc
                      created_by: example
                      created_at: '2026-01-01T00:00:00Z'
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - id: resource-001
                    name: example-resourc
                    created_by: example
                    created_at: '2026-01-01T00:00:00Z'
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [systems]
      summary: Create system (self-service, no approval)
      operationId: createSystem
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:write'
      requestBody:
        description: System name and description for the new self-service system.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCreateRequest'
              example:
                name: example-resourc
                description: Example description
            example:
              name: example-resourc
              description: Example description
      responses:
        '201':
          description: System created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
                example:
                  id: resource-001
                  name: example-resourc
                  created_by: example
                  created_at: '2026-01-01T00:00:00Z'
              example:
                id: resource-001
                name: example-resourc
                created_by: example
                created_at: '2026-01-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/filter-options:
    get:
      tags: [systems]
      summary: List system filter options
      operationId: getSystemFilterOptions
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:read'
        scopeFilters:
          - type: actor_visible_systems
      responses:
        '200':
          description: Searchable exact filter options for the systems list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemFilterOptionsResponse'
                example:
                  creators:
                    - value: example
                      label: example
                      group: example
                  services:
                    - value: example
                      label: example
                      group: example
                  members:
                    - value: example
                      label: example
                      group: example
              example:
                creators:
                  - value: example
                    label: example
                    group: example
                services:
                  - value: example
                    label: example
                    group: example
                members:
                  - value: example
                    label: example
                    group: example
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /systems/{system_id}:
    get:
      tags: [systems]
      summary: Get system by ID
      operationId: getSystem
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:read'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: view
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
      responses:
        '200':
          description: System details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
                example:
                  id: resource-001
                  name: example-resourc
                  created_by: example
                  created_at: '2026-01-01T00:00:00Z'
              example:
                id: resource-001
                name: example-resourc
                created_by: example
                created_at: '2026-01-01T00:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [systems]
      summary: Update system description
      description: |
        Stage 4.C: only `description` is mutable.
        System name is immutable after creation.
      operationId: updateSystem
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:write'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: update
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        description: Mutable system fields for the existing system.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateRequest'
              example:
                description: Example description
            example:
              description: Example description
      responses:
        '200':
          description: System updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
                example:
                  id: resource-001
                  name: example-resourc
                  created_by: example
                  created_at: '2026-01-01T00:00:00Z'
              example:
                id: resource-001
                name: example-resourc
                created_by: example
                created_at: '2026-01-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [systems]
      summary: Delete system
      description: |
        Requires typing system name to confirm (ADR-0015 §13).
        Cascade constraint: must have zero child services.
      operationId: deleteSystem
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:delete'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: delete
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - name: confirm_name
          in: query
          description: |
            Type system name to confirm deletion (ADR-0015 §13 addendum).
            Must match the system name exactly.
          required: true
          schema:
            type: string
            example: example-confirm
          example: example-confirm
      responses:
        '204':
          description: System deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/members:
    get:
      tags: [systems]
      summary: List system members
      operationId: listSystemMembers
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'system:read'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: view
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
      responses:
        '200':
          description: System member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMemberList'
                example:
                  items:
                    - user_id: user-001
                      username: example-user
                      role: owner
                  profile_fields:
                    - key: example.key
                      label: example
                      searchable: true
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - user_id: user-001
                    username: example-user
                    role: owner
                profile_fields:
                  - key: example.key
                    label: example
                    searchable: true
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [systems]
      summary: Add system member
      operationId: addSystemMember
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'rbac:manage'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: manage_members
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        description: User and role assignment for a new system member.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemMemberCreateRequest'
              example:
                user_id: user-001
                role: owner
            example:
              user_id: user-001
              role: owner
      responses:
        '201':
          description: System member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMember'
                example:
                  user_id: user-001
                  username: example-user
                  role: owner
              example:
                user_id: user-001
                username: example-user
                role: owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/member-candidates:
    get:
      tags: [systems, admin]
      summary: List addable system member candidates
      operationId: listSystemMemberCandidates
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'rbac:manage'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: manage_members
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Addable user candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
                example:
                  items:
                    - id: resource-001
                      username: example-user
                      enabled: true
                      created_at: '2026-01-01T00:00:00Z'
                  profile_fields:
                    - key: example.key
                      label: example
                      searchable: true
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - id: resource-001
                    username: example-user
                    enabled: true
                    created_at: '2026-01-01T00:00:00Z'
                profile_fields:
                  - key: example.key
                    label: example
                    searchable: true
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /systems/{system_id}/members/{user_id}:
    patch:
      tags: [systems]
      summary: Update system member role
      operationId: updateSystemMemberRole
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'rbac:manage'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: manage_members
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        description: Replacement role assignment for an existing system member.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemMemberRoleUpdateRequest'
              example:
                role: owner
            example:
              role: owner
      responses:
        '200':
          description: System member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMember'
                example:
                  user_id: user-001
                  username: example-user
                  role: owner
              example:
                user_id: user-001
                username: example-user
                role: owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [systems]
      summary: Remove system member
      operationId: deleteSystemMember
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'rbac:manage'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: manage_members
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: System member removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── Services ────────────────────────────────────────
  /services:
    get:
      tags: [services]
      summary: List services across visible systems
      operationId: listServicesOverview
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'service:read'
        scopeFilters:
          - type: actor_visible_systems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SystemIDFilter'
      responses:
        '200':
          description: Service list across visible systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
                example:
                  items:
                    - id: resource-001
                      name: example-resource
                      system_id: system-001
                      system_name: example-system
                      created_at: '2026-01-01T00:00:00Z'
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - id: resource-001
                    name: example-resource
                    system_id: system-001
                    system_name: example-system
                    created_at: '2026-01-01T00:00:00Z'
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /systems/{system_id}/services:
    get:
      tags: [services]
      summary: List services in a system
      operationId: listServices
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'service:read'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: view
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
                example:
                  items:
                    - id: resource-001
                      name: example-resource
                      system_id: system-001
                      system_name: example-system
                      created_at: '2026-01-01T00:00:00Z'
                  pagination:
                    page: 1
                    per_page: 1
                    total: 1
              example:
                items:
                  - id: resource-001
                    name: example-resource
                    system_id: system-001
                    system_name: example-system
                    created_at: '2026-01-01T00:00:00Z'
                pagination:
                  page: 1
                  per_page: 1
                  total: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [services]
      summary: Create service (self-service, no approval)
      operationId: createService
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'service:create'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: create
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        description: Service name and description scoped to the target system.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
              example:
                name: example-resourc
                description: Example description
            example:
              name: example-resourc
              description: Example description
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
                example:
                  id: resource-001
                  name: example-resource
                  system_id: system-001
                  system_name: example-system
                  created_at: '2026-01-01T00:00:00Z'
              example:
                id: resource-001
                name: example-resource
                system_id: system-001
                system_name: example-system
                created_at: '2026-01-01T00:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/services/{service_id}:
    get:
      tags: [services]
      summary: Get service details
      operationId: getService
      x-rbac:
        authentication: bearer
        platformAdminOverride: true
        globalPermissions:
          anyOf:
            - 'service:read'
        resourceRoles:
          - resourceType: system
            resourceIdParam: system_id
            action: view
            onDenied: forbidden
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
                example:
                  id: resource-001
                  name: example-resource
