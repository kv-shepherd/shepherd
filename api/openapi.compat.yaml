openapi: 3.0.3
info:
  title: KubeVirt Shepherd API
  description: |
    API for managing KubeVirt virtual machines and cloud-native governance.
    Adheres to ADR-0021: API Contract-First Development.
  version: 1.0.0
  contact:
    name: KubeVirt Shepherd Team
    url: https://github.com/kv-shepherd/shepherd
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: /api/v1
    description: Production API
tags:
  - name: health
    description: Health check endpoints
  - name: systems
    description: System management (ADR-0015)
  - name: services
    description: Service management
  - name: vms
    description: Virtual machine management
  - name: approval
    description: Approval workflow (ADR-0005)
  - name: clusters
    description: Cluster management
  - name: templates
    description: Template management
  - name: instance-sizes
    description: Instance size management (ADR-0018)
  - name: auth
    description: Authentication
  - name: admin
    description: Admin operations
  - name: audit
    description: Audit log operations
  - name: namespaces
    description: Namespace registry management (ADR-0017)
  - name: notifications
    description: Platform inbox notifications (ADR-0015 §20)
  - name: rbac
    description: RBAC role and global binding management
  - name: auth-providers
    description: Pluggable authentication provider management
  - name: schemas
    description: Dynamic configuration schemas for entities
paths:
  # ── Health ──────────────────────────────────────────
  /health/live:
    get:
      tags: [health]
      summary: Liveness probe
      operationId: getLiveness
      security: []
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      tags: [health]
      summary: Readiness probe
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  # ── Schemas ─────────────────────────────────────────
  /schemas/{entity_type}:
    get:
      tags: [schemas]
      summary: Retrieve dynamic schema and UI mask for an entity
      operationId: getDynamicSchema
      # Public endpoint: schema metadata does not contain sensitive data and
      # must be accessible before a user logs in (bootstrap scenario, ADR-0023).
      security: []
      parameters:
        - name: entity_type
          in: path
          required: true
          schema:
            type: string
            # Only entity types with dynamic schema forms are listed here.
            # template: excluded — cloud_init is a static YAML textarea, no dynamic schema (master-flow Step 3).
            # cluster:  excluded — no cluster-level override schema defined yet (ADR-0023 phase 2).
            enum: [instancesize]
      responses:
        '200':
          description: Dynamic schema retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicSchemaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  # ── Systems ─────────────────────────────────────────
  /systems:
    get:
      tags: [systems]
      summary: List systems
      operationId: listSystems
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SystemCreatedBySearch'
        - $ref: '#/components/parameters/SystemCreatedByExact'
        - $ref: '#/components/parameters/SystemServiceSearch'
        - $ref: '#/components/parameters/SystemServiceIDFilter'
        - $ref: '#/components/parameters/SystemMemberSearch'
        - $ref: '#/components/parameters/SystemMemberIDFilter'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: System list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [systems]
      summary: Create system (self-service, no approval)
      operationId: createSystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCreateRequest'
      responses:
        '201':
          description: System created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/filter-options:
    get:
      tags: [systems]
      summary: List system filter options
      operationId: getSystemFilterOptions
      responses:
        '200':
          description: Searchable exact filter options for the systems list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemFilterOptionsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /systems/{system_id}:
    get:
      tags: [systems]
      summary: Get system by ID
      operationId: getSystem
      parameters:
        - $ref: '#/components/parameters/SystemID'
      responses:
        '200':
          description: System details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags: [systems]
      summary: Update system description
      description: |
        Stage 4.C: only `description` is mutable.
        System name is immutable after creation.
      operationId: updateSystem
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemUpdateRequest'
      responses:
        '200':
          description: System updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/System'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [systems]
      summary: Delete system
      description: |
        Requires typing system name to confirm (ADR-0015 §13).
        Cascade constraint: must have zero child services.
      operationId: deleteSystem
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - name: confirm_name
          in: query
          description: |
            Type system name to confirm deletion (ADR-0015 §13 addendum).
            Must match the system name exactly.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: System deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/members:
    get:
      tags: [systems]
      summary: List system members
      operationId: listSystemMembers
      parameters:
        - $ref: '#/components/parameters/SystemID'
      responses:
        '200':
          description: System member list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMemberList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [systems]
      summary: Add system member
      operationId: addSystemMember
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemMemberCreateRequest'
      responses:
        '201':
          description: System member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/member-candidates:
    get:
      tags: [systems, admin]
      summary: List addable system member candidates
      operationId: listSystemMemberCandidates
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Addable user candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /systems/{system_id}/members/{user_id}:
    patch:
      tags: [systems]
      summary: Update system member role
      operationId: updateSystemMemberRole
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/UserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemMemberRoleUpdateRequest'
      responses:
        '200':
          description: System member updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [systems]
      summary: Remove system member
      operationId: deleteSystemMember
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/UserID'
      responses:
        '204':
          description: System member removed
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── Services ────────────────────────────────────────
  /services:
    get:
      tags: [services]
      summary: List services across visible systems
      operationId: listServicesOverview
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/SystemIDFilter'
      responses:
        '200':
          description: Service list across visible systems
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
        '403':
          $ref: '#/components/responses/Forbidden'
  /systems/{system_id}/services:
    get:
      tags: [services]
      summary: List services in a system
      operationId: listServices
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Service list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceList'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [services]
      summary: Create service (self-service, no approval)
      operationId: createService
      parameters:
        - $ref: '#/components/parameters/SystemID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceCreateRequest'
      responses:
        '201':
          description: Service created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/services/{service_id}:
    get:
      tags: [services]
      summary: Get service details
      operationId: getService
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '200':
          description: Service details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [services]
      summary: Update service description
      description: |
        Stage 4.C: only `description` is mutable.
        Service name is immutable after creation.
      operationId: updateService
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/ServiceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceUpdateRequest'
      responses:
        '200':
          description: Service updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [services]
      summary: Delete service
      description: |
        Cascade constraint: must have zero child VMs.
        Requires confirm=true query parameter (ADR-0015 §13).
      operationId: deleteService
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/ServiceID'
        - $ref: '#/components/parameters/Confirm'
      responses:
        '204':
          description: Service deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /systems/{system_id}/services/{service_id}/context:
    get:
      tags: [services]
      summary: Get service workspace context
      description: |
        Returns the service detail workspace context as a single server-shaped payload,
        including service metadata, recent visible virtual machines, and the current
        actor's recent create requests for this service.
      operationId: getServiceWorkspaceContext
      parameters:
        - $ref: '#/components/parameters/SystemID'
        - $ref: '#/components/parameters/ServiceID'
      responses:
        '200':
          description: Service workspace context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceWorkspaceContext'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  # ── VMs ─────────────────────────────────────────────
  /vms:
    get:
      tags: [vms]
      summary: List VMs
      operationId: listVMs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/Search'
        - name: namespace
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: cluster_id
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/SystemIDFilter'
        - name: service_id
          in: query
          schema:
            type: string
        - name: os_name
          in: query
          schema:
            type: string
        - name: ip_address
          in: query
          schema:
            type: string
      responses:
        '200':
          description: VM list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMList'
        '403':
          $ref: '#/components/responses/Forbidden'
  /vms/filter-options:
    get:
      tags: [vms]
      summary: Get VM filter options
      description: |
        Returns the current user's visible VM filter catalogs for exact-match advanced filtering.
        Option values are stable identifiers when available, while labels stay human-readable.
      operationId: getVMFilterOptions
      responses:
        '200':
          description: VM filter option catalogs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMFilterOptionsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
  /vms/request-context:
    get:
      tags: [vms]
      summary: Get VM request context for current user
      description: |
        Returns user-visible context required by VM request wizard.
        Context is computed using current RBAC/environment visibility rules.
        When `namespace`, `template_id`, and `instance_size_id` are all supplied,
        the response may also include a sanitized placement hint summary. The
        hint is intended for end-user guidance and does not expose cluster
        identities or raw policy messages.
      operationId: getVMRequestContext
      parameters:
        - name: namespace
          in: query
          required: false
          schema:
            type: string
          description: Optional selected namespace for placement hint evaluation.
        - name: template_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional selected template for placement hint evaluation.
        - name: instance_size_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Optional selected instance size for placement hint evaluation.
      responses:
        '200':
          description: VM request context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMRequestContext'
  /vms/request:
    post:
      tags: [vms]
      summary: Submit VM creation request (requires approval)
      operationId: createVMRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMCreateRequest'
      responses:
        '202':
          description: Request accepted, pending approval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /vms/batch:
    get:
      tags: [vms]
      summary: List VM batch jobs
      description: |
        Returns a paginated list of batch job summaries for the current user.
        Admins see all batches; regular users see only their own.
      operationId: listVMBatches
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/SortBy'
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: Batch job list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [vms]
      summary: Submit VM batch request
      description: |
        Stage 5.E batch submit entrypoint (ADR-0015 §19).
        Uses parent-child ticket model with idempotency key support.
      operationId: submitVMBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMBatchSubmitRequest'
      responses:
        '202':
          description: Batch request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Batch request conflicts with current resource state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vms/batch/power:
    post:
      tags: [vms]
      summary: Submit VM batch power request (compatibility endpoint)
      description: |
        Compatibility endpoint normalized into Stage 5.E parent-child pipeline.
        Executes child power operations independently with best-effort semantics.
      operationId: submitVMBatchPower
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMBatchPowerRequest'
      responses:
        '202':
          description: Batch power request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchSubmitResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /vms/batch/{batch_id}:
    get:
      tags: [vms]
      summary: Get VM batch status
      operationId: getVMBatch
      parameters:
        - $ref: '#/components/parameters/BatchID'
      responses:
        '200':
          description: Batch status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchStatusResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /vms/batch/{batch_id}/retry:
    post:
      tags: [vms]
      summary: Retry failed children in a VM batch
      operationId: retryVMBatch
      parameters:
        - $ref: '#/components/parameters/BatchID'
      responses:
        '200':
          description: Retry action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchActionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /vms/batch/{batch_id}/cancel:
    post:
      tags: [vms]
      summary: Cancel pending children in a VM batch
      operationId: cancelVMBatch
      parameters:
        - $ref: '#/components/parameters/BatchID'
      responses:
        '200':
          description: Cancel action accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMBatchActionResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /vms/{vm_id}:
    get:
      tags: [vms]
      summary: Get VM by ID
      operationId: getVM
      parameters:
        - $ref: '#/components/parameters/VMID'
      responses:
        '200':
          description: VM details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VM'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [vms]
      summary: Delete VM
      description: |
        Async via River (ADR-0006). Returns 202 Accepted with event_id.
        test env: requires confirm=true query parameter.
        prod env: requires confirm_name matching VM name exactly.
        Tiered confirmation per ADR-0015 §13.
      operationId: deleteVM
      parameters:
        - $ref: '#/components/parameters/VMID'
        - $ref: '#/components/parameters/Confirm'
        - $ref: '#/components/parameters/ConfirmName'
      responses:
        '202':
          description: Deletion accepted (ticket created)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteVMResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vms/{vm_id}/request-prefill:
    get:
      tags: [vms]
      summary: Get reusable VM request prefill
      description: |
        Returns the reusable CREATE-request context captured for an existing VM,
        so the UI can open a prefilled "request similar VM" flow without
        implying a direct KubeVirt clone.
      operationId: getVMRequestPrefill
      parameters:
        - $ref: '#/components/parameters/VMID'
      responses:
        '200':
          description: Reusable VM request prefill
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMRequestPrefill'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vms/{vm_id}/modify-context:
    get:
      tags: [vms]
      summary: Get VM live-modify context
      description: |
        Returns the current live VM resource envelope together with per-field
        online-update support flags so the UI can build a safe modify request.
      operationId: getVMModifyContext
      parameters:
        - $ref: '#/components/parameters/VMID'
      responses:
        '200':
          description: Live-modify context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VMModifyContext'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /vms/{vm_id}/modify-request:
    post:
      tags: [vms]
      summary: Submit a VM resource change request
      description: |
        Submits a CPU/memory/disk change request for a single VM.
        The request always goes through approval and is validated for online-only
        expansion semantics before the ticket is created.
      operationId: createVMModifyRequest
      parameters:
        - $ref: '#/components/parameters/VMID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VMModifyRequest'
      responses:
        '202':
          description: Modification request accepted (ticket created)
          content:
